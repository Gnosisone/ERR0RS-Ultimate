# =============================================================================
# ERR0RS-Ultimate — Python project metadata
# Format: PEP 621 (pyproject.toml standard)
# Validate: python3 -m pip install validate-pyproject && validate-pyproject pyproject.toml
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "err0rs-ultimate"
version = "3.5.0"
description = "Open-source AI penetration testing platform — a wise, compassionate, patient teacher of cybersecurity. Built for students and operators who can't afford the enterprise tools."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Gary Holden Schneider (Eros)", email = "g.holden.schneider@icloud.com" },
]
maintainers = [
  { name = "Gary Holden Schneider (Eros)", email = "g.holden.schneider@icloud.com" },
]

keywords = [
  "pentesting",
  "cybersecurity",
  "red-team",
  "purple-team",
  "education",
  "kali-linux",
  "ollama",
  "claude",
  "ai-security",
  "offensive-security",
  "mitre-attack",
  "owasp",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  # Core
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "click>=8.1",
  "psutil>=5.9",

  # LLM backends — see docs/BACKEND_STRATEGY.md
  "anthropic>=0.7.8",   # Claude (primary)
  "openai>=1.3.7",      # DeepSeek (secondary, OpenAI-compatible)

  # RAG / embeddings
  "chromadb>=0.4.18",
  "sentence-transformers>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "validate-pyproject>=0.16",
]

docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage      = "https://github.com/Gnosisone/ERR0RS-Ultimate"
Documentation = "https://github.com/Gnosisone/ERR0RS-Ultimate#readme"
Repository    = "https://github.com/Gnosisone/ERR0RS-Ultimate"
Issues        = "https://github.com/Gnosisone/ERR0RS-Ultimate/issues"
Changelog     = "https://github.com/Gnosisone/ERR0RS-Ultimate/blob/main/CHANGELOG.md"
"Juice Shop Portfolio" = "https://github.com/Gnosisone/juice-shop-portfolio"
"Phoenix-OS"  = "https://github.com/Gnosisone/Phoenix-OS"

[project.scripts]
# Optional console-script entry points. Use these if installing ERR0RS as a
# pip package; otherwise the project is normally launched via start_err0rs.sh
# or `python3 main.py`.
err0rs = "main:main_cli"

# =============================================================================
# Tool configuration
# =============================================================================

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"src" = ["ai/*.md", "tools/*.json", "tools/*.schema.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line-too-long — handled by formatter
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false   # ERR0RS has many legacy modules; tighten gradually
ignore_missing_imports = true
